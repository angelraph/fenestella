<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#6fcfae" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#060707" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slit" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6fcfae"/>
      <stop offset="1" stop-color="#6fcfae" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="stones" width="144" height="80" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="140" height="36" rx="5" fill="#141816" stroke="#232926"/>
      <rect x="-70" y="42" width="140" height="36" rx="5" fill="#141816" stroke="#232926"/>
      <rect x="74" y="42" width="140" height="36" rx="5" fill="#141816" stroke="#232926"/>
    </pattern>
    <clipPath id="wallclip"><rect x="980" y="150" width="500" height="600" rx="28"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#060707"/>
  <rect width="1600" height="900" fill="url(#g)"/>

  <g clip-path="url(#wallclip)">
    <rect x="980" y="150" width="500" height="600" fill="#030404"/>
    <rect x="980" y="150" width="500" height="600" fill="url(#stones)"/>
    <path d="M1196 750 V402 a34 34 0 0 1 68 0 V750 Z" fill="url(#slit)"/>
    <path d="M1196 750 V402 a34 34 0 0 1 68 0 V750" fill="none" stroke="#6fcfae" stroke-width="3"/>
  </g>
  <rect x="980" y="150" width="500" height="600" rx="28" fill="none" stroke="#6fcfae" stroke-opacity="0.45" stroke-width="2"/>

  <g transform="translate(118 150) scale(1.5)">
    <path d="M8 19 L30 8 L56 20 V30 L32 19 L19 25.5 V51 L8 56 Z" fill="#f3eee2"/>
    <path d="M26 46.5 L33.5 43 L56 53.5 V62 Z" fill="#f3eee2"/>
    <path d="M36 27 L50 33.5 V46.5 L36 40 Z" fill="#6fcfae"/>
  </g>
  <text x="232" y="216" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="12" fill="#f3eee2">FENESTELLA</text>

  <text font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="92" fill="#f3eee2" letter-spacing="-3">
    <tspan x="120" y="400">How far does</tspan>
    <tspan x="120" y="504">your key <tspan fill="#6fcfae">reach</tspan>?</tspan>
  </text>
  <text font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#a8aca4">
    <tspan x="122" y="590">See what a leaked key can still do on QoreChain.</tspan>
    <tspan x="122" y="636">Open a window scoped to exactly what you need.</tspan>
    <tspan x="122" y="682">Let dApps and agents ask for it.</tspan>
  </text>
  <rect x="120" y="738" width="430" height="56" rx="28" fill="none" stroke="#6fcfae" stroke-opacity="0.5" stroke-width="2"/>
  <text x="335" y="775" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6fcfae">Build Before Q-Day · qorechain-diana</text>
