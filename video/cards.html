<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fenestella cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet" />
<style>
  :root { --bg: #060707; --cream: #f3eee2; --mint: #6fcfae; --dim: #a8aca4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--cream); display: grid; place-items: center; }
  .glow { position: fixed; inset: -20%; background: radial-gradient(40% 35% at 50% 38%, rgba(111, 207, 174, 0.20), transparent 70%); opacity: 0; animation: glow 3s ease-out 0.2s forwards; }
  .grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(243,238,226,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(243,238,226,0.035) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(60% 60% at 50% 45%, #000, transparent 80%); opacity: 0; animation: fade 2.4s ease 0.4s forwards; }
  .stage { position: relative; display: grid; justify-items: center; gap: 34px; text-align: center; }
  .mark { width: 220px; height: 220px; }
  .mark .a { transform: translateX(-60px); opacity: 0; animation: inLeft 1.1s cubic-bezier(.2,.8,.2,1) 0.35s forwards; }
  .mark .b { transform: translateX(60px); opacity: 0; animation: inRight 1.1s cubic-bezier(.2,.8,.2,1) 0.55s forwards; }
  .mark .pane { transform-origin: 43px 37px; transform: scale(0.2); opacity: 0; animation: pane 0.9s cubic-bezier(.2,1.4,.3,1) 1.25s forwards; filter: drop-shadow(0 0 0 rgba(111,207,174,0)); }
  .word { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 74px; letter-spacing: 0.34em; padding-left: 0.34em; display: flex; }
  .word span { opacity: 0; transform: translateY(18px); animation: up 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
  .tag { font-size: 30px; color: var(--dim); opacity: 0; transform: translateY(14px); animation: up 0.9s ease 2.6s forwards; }
  .tag b { color: var(--mint); font-weight: 500; }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--mint); border: 1px solid rgba(111,207,174,0.45); border-radius: 999px; padding: 10px 22px; opacity: 0; animation: fade 0.8s ease 3.2s forwards; }
  .links { display: grid; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--cream); opacity: 0; transform: translateY(14px); animation: up 0.9s ease 2.4s forwards; }
  .links span { color: var(--dim); }
  .line { width: 0; height: 2px; background: var(--mint); animation: wipe 1.2s cubic-bezier(.6,0,.2,1) 2.2s forwards; }
  .out { animation: outAll 0.7s ease forwards; }
  @keyframes inLeft { to { transform: none; opacity: 1; } }
  @keyframes inRight { to { transform: none; opacity: 1; } }
  @keyframes pane { 60% { opacity: 1; } to { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 18px rgba(111,207,174,0.55)); } }
  @keyframes up { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes glow { to { opacity: 1; } }
  @keyframes wipe { to { width: 420px; } }
  @keyframes outAll { to { opacity: 0; transform: scale(0.98); filter: blur(4px); } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="grid"></div>
<div class="stage" id="stage"></div>
<script>
  const kind = new URLSearchParams(location.search).get("kind") || "intro";
  const mark = `
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path class="a" d="M8 19 L30 8 L56 20 V30 L32 19 L19 25.5 V51 L8 56 Z" fill="#f3eee2"/>
      <path class="b" d="M26 46.5 L33.5 43 L56 53.5 V62 Z" fill="#f3eee2"/>
      <path class="pane" d="M36 27 L50 33.5 V46.5 L36 40 Z" fill="#6fcfae"/>
    </svg>`;
  const word = [..."FENESTELLA"].map((c, i) => `<span style="animation-delay:${1.45 + i * 0.06}s">${c}</span>`).join("");
  const stage = document.getElementById("stage");
  if (kind === "intro") {
    stage.innerHTML = `${mark}<div class="word">${word}</div><div class="line"></div>
      <div class="tag">The small window on a <b>QoreChain</b> account</div>
      <div class="pill">Build Before Q-Day · Post-Quantum AI Agents</div>`;
  } else {
    stage.innerHTML = `${mark}<div class="word">${word}</div><div class="line"></div>
      <div class="links"><div>fenestella.vercel.app</div><div><span>github.com/</span>angelraph/fenestella</div><div><span>npx </span>@fenestella/mcp</div></div>
      <div class="pill">Live on qorechain-diana · MIT</div>`;
  }
  window.leave = () => stage.classList.add("out");
</script>
</body>
</html>
